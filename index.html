<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Сканер штрихкодов</title>
                <!-- Подключаем библиотеку для сканирования с камеры -->
                    <script src="https://unpkg.com" type="text/javascript"></script>
                        <style>
                                body { font-family: Arial, sans-serif; margin: 15px; background: #f4f4f9; }
                                        h2 { text-align: center; font-size: 20px; }
                                                #reader { width: 100%; max-width: 500px; margin: 0 auto; background: #000; border-radius: 8px; overflow: hidden; }
                                                        .controls { text-align: center; margin: 15px 0; }
                                                                button { padding: 12px 20px; font-size: 16px; border: none; border-radius: 6px; cursor: pointer; margin: 5px; }
                                                                        .btn-download { background: #28a745; color: white; }
                                                                                .btn-clear { background: #dc3545; color: white; }
                                                                                        table { width: 100%; border-collapse: collapse; margin-top: 15px; background: white; }
                                                                                                th, td { border: 1px solid #ddd; padding: 10px; text-align: left; font-size: 14px; }
                                                                                                        th { background: #007bff; color: white; }
                                                                                                            </style>
                                                                                                            </head>
                                                                                                            <body>

                                                                                                                <h2>Сканер штрихкодов</h2>
                                                                                                                    
                                                                                                                        <!-- Окно камеры -->
                                                                                                                            <div id="reader"></div>

                                                                                                                                <div class="controls">
                                                                                                                                        <button class="btn-download" onclick="downloadCSV()">Скачать таблицу (CSV)</button>
                                                                                                                                                <button class="btn-clear" onclick="clearTable()">Очистить</button>
                                                                                                                                                    </div>

                                                                                                                                                        <!-- Таблица результатов -->
                                                                                                                                                            <table id="resultTable">
                                                                                                                                                                    <thead>
                                                                                                                                                                                <tr>
                                                                                                                                                                                                <th>№</th>
                                                                                                                                                                                                                <th>Штрихкод</th>
                                                                                                                                                                                                                                <th>Время</th>
                                                                                                                                                                                                                                            </tr>
                                                                                                                                                                                                                                                    </thead>
                                                                                                                                                                                                                                                            <tbody></tbody>
                                                                                                                                                                                                                                                                </table>

                                                                                                                                                                                                                                                                    <script>
                                                                                                                                                                                                                                                                            let scannedCodes = new Set(); // Для защиты от случайных дублей подряд
                                                                                                                                                                                                                                                                                    let records = [];

                                                                                                                                                                                                                                                                                            // Звуковой сигнал при успешном сканировании
                                                                                                                                                                                                                                                                                                    function beep() {
                                                                                                                                                                                                                                                                                                                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                                                                                                                                                                                                                                                                                                                            const osc = ctx.createOscillator();
                                                                                                                                                                                                                                                                                                                                        osc.type = "sine";
                                                                                                                                                                                                                                                                                                                                                    osc.frequency.setValueAtTime(800, ctx.currentTime);
                                                                                                                                                                                                                                                                                                                                                                osc.connect(ctx.destination);
                                                                                                                                                                                                                                                                                                                                                                            osc.start();
                                                                                                                                                                                                                                                                                                                                                                                        osc.stop(ctx.currentTime + 0.1);
                                                                                                                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                                                                                                                        function onScanSuccess(decodedText) {
                                                                                                                                                                                                                                                                                                                                                                                                                    // Если код уже отсканирован, пропускаем
                                                                                                                                                                                                                                                                                                                                                                                                                                if (scannedCodes.has(decodedText)) return;

                                                                                                                                                                                                                                                                                                                                                                                                                                            scannedCodes.add(decodedText);
                                                                                                                                                                                                                                                                                                                                                                                                                                                        beep();

                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const now = new Date().toLocaleTimeString('ru-RU');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const index = records.length + 1;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            records.push({ index, code: decodedText, time: now });

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        // Добавляем строку в таблицу на экране
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const tbody = document.querySelector("#resultTable tbody");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const row = `<tr><td>${index}</td><td><b>${decodedText}</b></td><td>${now}</td></tr>`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            tbody.insertAdjacentHTML('afterbegin', row);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            // Запуск сканера с задней камеры телефона
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const html5QrCode = new Html5Qrcode("reader");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            html5QrCode.start(
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        { facingMode: "environment" },
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    { fps: 10, qrbox: { width: 280, height: 150 } },
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                onScanSuccess
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        ).catch(err => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    alert("Ошибка доступа к камере: " + err);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            });

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    // Выгрузка в CSV (открывается в Excel)
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            function downloadCSV() {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        if (records.length === 0) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        alert("Таблица пуста!");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                // Добавляем BOM (\uFEFF) для корректной кириллицы в Excel
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            let csvContent = "\uFEFF№;Штрихкод;Время\n";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        records.forEach(r => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        // Добавляем кавычки, чтобы Excel не превращал длинные числа в формат 7.78E+14
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        csvContent += `${r.index};"${r.code}";${r.time}\n`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    });

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const link = document.createElement("a");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        link.href = URL.createObjectURL(blob);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    link.download = `barcodes_${new Date().toISOString().slice(0,10)}.csv`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                link.click();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                function clearTable() {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            if (confirm("Очистить список?")) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            scannedCodes.clear();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            records = [];
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            document.querySelector("#resultTable tbody").innerHTML = "";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </html>
