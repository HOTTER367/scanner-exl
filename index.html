<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Сканер плазмы</title>
<style>
body{font-family:sans-serif;margin:10px;background:#f4f4f9;text-align:center}
video{width:100%;max-width:480px;max-height:240px;background:#000;border-radius:8px;object-fit:cover}
button{padding:12px;font-size:15px;border:none;border-radius:6px;font-weight:bold;margin:3px;cursor:pointer}
.b-main{background:#007bff;color:#fff;width:90%;max-width:300px}
.b-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;max-width:480px;margin:8px auto}
.b-grp{background:#e9ecef;border:2px solid #ccc;padding:12px 0}
.b-grp.active{background:#d9534f;color:#fff;border-color:#b52b27}
table{width:100%;max-width:480px;margin:10px auto;border-collapse:collapse;background:#fff;font-size:13px}
th,td{border:1px solid #ddd;padding:6px}
th{background:#333;color:#fff}
.warn{background:#fff3cd}
#err{color:#721c24;background:#f8d7da;padding:8px;border-radius:6px;display:none;margin:8px auto;max-width:480px}
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);align-items:center;justify-content:center}
.mbox{background:#fff;padding:18px;border-radius:10px;width:85%;max-width:320px}
.mbox input{width:80%;padding:10px;font-size:22px;text-align:center;margin:10px 0;border:2px solid #007bff;border-radius:6px}
</style>
</head>
<body>
<div id="err"></div>
<button id="sBtn" class="b-main" onclick="startCam()">📷 Включить камеру</button>
<div><video id="vid" playsinline muted></video></div>

<div class="b-grid">
<button class="b-grp" onclick="setGrp('O(I)',this)">O(I)</button>
<button class="b-grp" onclick="setGrp('A(II)',this)">A(II)</button>
<button class="b-grp" onclick="setGrp('B(III)',this)">B(III)</button>
<button class="b-grp" onclick="setGrp('AB(IV)',this)">AB(IV)</button>
</div>
<label><input type="checkbox" id="lock"> Закрепить группу</label><br>

<button style="background:#28a745;color:#fff" onclick="csv()">Скачать CSV</button>
<button style="background:#6c757d;color:#fff" onclick="clr()">Очистить</button>

<table id="tbl"><thead><tr><th>№</th><th>Штрихкод</th><th>Группа</th><th>Вес</th></tr></thead><tbody></tbody></table>

<div id="modal"><div class="mbox">
<b>Введите вес (г)</b><div id="mCode" style="font-size:13px;color:#555;margin-top:4px"></div>
<input type="number" id="wIn" inputmode="decimal" onkeydown="if(event.key==='Enter')saveW()">
<div><button onclick="closeM()">Пропустить</button><button style="background:#28a745;color:#fff" onclick="saveW()">Сохранить</button></div>
</div></div>

<script>
const KEY="plasma_scan_data";
let recs=JSON.parse(localStorage.getItem(KEY)||"[]");
let codes=new Set(recs.map(r=>r.c));
let det=null,grp="",paused=false;

const err=m=>{let e=document.getElementById("err");e.style.display="block";e.innerText=m};
const beep=()=>{try{let c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator();o.frequency.value=800;o.connect(c.destination);o.start();o.stop(c.currentTime+.1)}catch(e){}};
const save=()=>localStorage.setItem(KEY,JSON.stringify(recs));

function render(){
let tb=document.querySelector("#tbl tbody");tb.innerHTML="";
[...recs].reverse().forEach(r=>{
let cls=(r.g&&r.w)?"":"warn";
tb.insertAdjacentHTML('beforeend',`<tr class="${cls}"><td>${r.i}</td><td><b>${r.c}</b></td><td style="color:#c9302c;font-weight:bold">${r.g||"—"}</td><td style="font-weight:bold">${r.w?r.w+" г":"—"}</td></tr>`);
});
}
render();

function setGrp(g,b){
grp=g;document.querySelectorAll('.b-grp').forEach(x=>x.classList.remove('active'));b.classList.add('active');
if(recs.length){recs[recs.length-1].g=g;save();render()}
}
function addRec(raw){
let c=raw.replace(/\D/g,'');if(paused||!c||codes.has(c))return;
codes.add(c);beep();
if(!document.getElementById("lock").checked){grp="";document.querySelectorAll('.b-grp').forEach(x=>x.classList.remove('active'))}
recs.push({i:recs.length+1,c,g:grp,w:""});save();render();
paused=true;document.getElementById("mCode").innerText=c;let inp=document.getElementById("wIn");inp.value="";
document.getElementById("modal").style.display="flex";setTimeout(()=>inp.focus(),100);
}
function saveW(){if(recs.length){recs[recs.length-1].w=document.getElementById("wIn").value.trim();save();render()}closeM()}
function closeM(){document.getElementById("modal").style.display="none";paused=false}

async function startCam(){
document.getElementById("err").style.display="none";
try{
let s=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"},audio:false});
let v=document.getElementById("vid");v.srcObject=s;await v.play();document.getElementById("sBtn").style.display="none";
if('BarcodeDetector' in window){det=new BarcodeDetector();loop(v)}else err("Откройте сайт в Google Chrome");
}catch(e){err("Нет доступа к камере: сбросьте разрешения сайта в настройках браузера")}
}
async function loop(v){
if(!paused&&v.readyState===v.HAVE_ENOUGH_DATA){try{(await det.detect(v)).forEach(b=>b.rawValue&&addRec(b.rawValue))}catch(e){}}
requestAnimationFrame(()=>loop(v));
}
function csv(){
if(!recs.length)return alert("Пусто");
let t="№;Штрихкод;Группа крови;Вес\r\n"+recs.map(r=>`${r.i};"${r.c}";"${r.g}";"${r.w}"`).join("\r\n");
let b=new Blob([new Uint8Array([0xEF,0xBB,0xBF]),new TextEncoder().encode(t)],{type:"text/csv;charset=utf-8;"});
let a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=`plasma_${new Date().toISOString().slice(0,10)}.csv`;a.click();
}
function clr(){if(confirm("Очистить все сохранённые записи?")){codes.clear();recs=[];localStorage.removeItem(KEY);render()}}
</script>
</body>
</html>
