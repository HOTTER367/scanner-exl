<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сканер штрихкодов</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 15px; background: #f4f4f9; }
        h2 { text-align: center; font-size: 20px; margin-bottom: 10px; }
        #videoContainer { width: 100%; max-width: 500px; margin: 0 auto; background: #000; border-radius: 8px; overflow: hidden; position: relative; }
        video { width: 100%; display: block; }
        .controls { text-align: center; margin: 15px 0; }
        button { padding: 12px 18px; font-size: 16px; border: none; border-radius: 6px; cursor: pointer; margin: 5px; font-weight: bold; }
        .btn-start { background: #007bff; color: white; width: 90%; max-width: 320px; }
        .btn-download { background: #28a745; color: white; }
        .btn-clear { background: #dc3545; color: white; }
        #errorBox { color: #721c24; background: #f8d7da; border: 1px solid #f5c6cb; padding: 10px; border-radius: 6px; margin: 10px auto; max-width: 500px; display: none; font-size: 14px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; background: white; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; font-size: 14px; }
        th { background: #343a40; color: white; }
    </style>
</head>
<body>

    <h2>Сканер штрихкодов</h2>
    <div id="errorBox"></div>

    <div class="controls">
        <button id="startBtn" class="btn-start" onclick="startCamera()">📷 Включить камеру</button>
    </div>

    <div id="videoContainer">
        <video id="video" playsinline></video>
    </div>

    <div class="controls">
        <button class="btn-download" onclick="downloadCSV()">Скачать CSV</button>
        <button class="btn-clear" onclick="clearTable()">Очистить</button>
    </div>

    <table id="resultTable">
        <thead>
            <tr>
                <th>№</th>
                <th>Штрихкод</th>
                <th>Время</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <script>
        let scannedCodes = new Set();
        let records = [];
        let detector = null;

        function showError(msg) {
            const box = document.getElementById("errorBox");
            box.style.display = "block";
            box.innerText = msg;
        }

        function beep() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                osc.type = "sine";
                osc.frequency.setValueAtTime(800, ctx.currentTime);
                osc.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.1);
            } catch (e) {}
        }

        function addRecord(code) {
            if (scannedCodes.has(code)) return;
            scannedCodes.add(code);
            beep();

            const now = new Date().toLocaleTimeString('ru-RU');
            const index = records.length + 1;
            records.push({ index, code: code, time: now });

            const tbody = document.querySelector("#resultTable tbody");
            const row = `<tr><td>${index}</td><td><b>${code}</b></td><td>${now}</td></tr>`;
            tbody.insertAdjacentHTML('afterbegin', row);
        }

        async function startCamera() {
            document.getElementById("errorBox").style.display = "none";

            if (!('BarcodeDetector' in window)) {
                showError("Ваш браузер не поддерживает встроенный сканер. Используйте Google Chrome на Android.");
                return;
            }

            try {
                detector = new BarcodeDetector();
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "environment" }
                });

                const video = document.getElementById("video");
                video.srcObject = stream;
                await video.play();

                document.getElementById("startBtn").style.display = "none";
                scanLoop(video);

            } catch (err) {
                showError("Ошибка запуска камеры: " + err.message);
            }
        }

        async function scanLoop(video) {
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                try {
                    const barcodes = await detector.detect(video);
                    for (const barcode of barcodes) {
                        if (barcode.rawValue) {
                            addRecord(barcode.rawValue);
                        }
                    }
                } catch (e) {}
            }
            requestAnimationFrame(() => scanLoop(video));
        }

        function downloadCSV() {
            if (records.length === 0) {
                alert("Таблица пуста!");
                return;
            }
            let csvContent = "\uFEFF№;Штрихкод;Время\n";
            records.forEach(r => {
                csvContent += `${r.index};"${r.code}";${r.time}\n`;
            });

            const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = `barcodes_${new Date().toISOString().slice(0,10)}.csv`;
            link.click();
        }

        function clearTable() {
            if (confirm("Очистить список?")) {
                scannedCodes.clear();
                records = [];
                document.querySelector("#resultTable tbody").innerHTML = "";
            }
        }
    </script>
</body>
</html>
