<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Сканер плазмы</title>
<style>
body{font-family:sans-serif;margin:8px;background:#f4f4f9;text-align:center}
#camBox{position:relative;width:100%;max-width:480px;margin:0 auto;background:#000;border-radius:8px;overflow:hidden}
video{width:100%;max-height:240px;object-fit:cover;display:block}
.guide{position:absolute;inset:32% 6%;border:2px solid #0f6;border-radius:6px;box-shadow:0 0 0 999px rgba(0,0,0,.35);pointer-events:none}
.guide::after{content:"";position:absolute;left:0;right:0;top:50%;height:2px;background:rgba(255,0,0,.7)}
button{padding:11px;font-size:15px;border:none;border-radius:6px;font-weight:bold;margin:3px;cursor:pointer}
.b-main{background:#007bff;color:#fff;width:90%;max-width:300px}
.b-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;max-width:480px;margin:8px auto}
.b-grp{background:#e9ecef;border:2px solid #ccc;padding:11px 0}
.b-grp.active{background:#d9534f;color:#fff;border-color:#b52b27}
table{width:100%;max-width:480px;margin:10px auto;border-collapse:collapse;background:#fff;font-size:13px}
th,td{border:1px solid #ddd;padding:6px}
th{background:#333;color:#fff}
.warn{background:#fff3cd}
#err{color:#721c24;background:#f8d7da;padding:8px;border-radius:6px;display:none;margin:8px auto;max-width:480px}
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);align-items:center;justify-content:center;z-index:99}
.mbox{background:#fff;padding:16px;border-radius:10px;width:85%;max-width:320px}
.mbox input{width:80%;padding:10px;font-size:22px;text-align:center;margin:10px 0;border:2px solid #007bff;border-radius:6px}
</style>
</head>
<body>
<div id="err"></div>
<button id="sBtn" class="b-main" onclick="startCam()">📷 Включить камеру</button>
<div id="camBox"><video id="vid" playsinline muted></video><div class="guide"></div></div>
<div class="b-grid">
<button class="b-grp" onclick="setGrp('O(I)',this)">O(I)</button>
<button class="b-grp" onclick="setGrp('A(II)',this)">A(II)</button>
<button class="b-grp" onclick="setGrp('B(III)',this)">B(III)</button>
<button class="b-grp" onclick="setGrp('AB(IV)',this)">AB(IV)</button>
</div>
<label><input type="checkbox" id="lock"> Закрепить группу</label><br>
<button style="background:#28a745;color:#fff" onclick="exportXLS()">Скачать Excel</button>
<button style="background:#6c757d;color:#fff" onclick="clr()">Очистить</button>
<table id="tbl"><thead><tr><th>№</th><th>Штрихкод</th><th>Группа</th><th>Объём</th></tr></thead><tbody></tbody></table>
<div id="modal"><div class="mbox">
<b>Введите объём (мл)</b><div id="mCode" style="font-size:13px;color:#555;margin-top:4px"></div>
<input type="number" id="vIn" inputmode="decimal" onkeydown="if(event.key==='Enter')saveV()">
<div><button onclick="closeM()">Пропустить</button><button style="background:#28a745;color:#fff" onclick="saveV()">Сохранить</button></div>
</div></div>
<script>
const KEY="plasma_scan_data";
let recs=JSON.parse(localStorage.getItem(KEY)||"[]"),codes=new Set(recs.map(r=>r.c)),det=null,grp="",paused=false,actx=null;
const err=m=>{let e=document.getElementById("err");e.style.display="block";e.innerText=m};
const beep=()=>{try{if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();if(actx.state==="suspended")actx.resume();let o=actx.createOscillator();o.frequency.value=800;o.connect(actx.destination);o.start();o.stop(actx.currentTime+.1)}catch(e){}};
const save=()=>localStorage.setItem(KEY,JSON.stringify(recs));

function render(){
let tb=document.querySelector("#tbl tbody");tb.innerHTML="";
[...recs].reverse().forEach(r=>{
let v=r.v??r.w??"";
tb.insertAdjacentHTML('beforeend',`<tr class="${(r.g&&v)?'':'warn'}"><td>${r.i}</td><td><b>${r.c}</b></td><td style="color:#c9302c;font-weight:bold">${r.g||"—"}</td><td style="font-weight:bold">${v?v+" мл":"—"}</td></tr>`);
});
}
render();

function setGrp(g,b){grp=g;document.querySelectorAll('.b-grp').forEach(x=>x.classList.remove('active'));b.classList.add('active');if(recs.length){recs[recs.length-1].g=g;save();render()}}
function addRec(raw){
let c=raw.replace(/\D/g,'');if(paused||!c||codes.has(c))return;
codes.add(c);beep();
if(!document.getElementById("lock").checked){grp="";document.querySelectorAll('.b-grp').forEach(x=>x.classList.remove('active'))}
recs.push({i:recs.length+1,c,g:grp,v:""});save();render();
paused=true;document.getElementById("mCode").innerText=c;let inp=document.getElementById("vIn");inp.value="";
document.getElementById("modal").style.display="flex";setTimeout(()=>inp.focus(),100);
}
function saveV(){if(recs.length){recs[recs.length-1].v=document.getElementById("vIn").value.trim();save();render()}closeM()}
function closeM(){document.getElementById("modal").style.display="none";paused=false}

const C128=["212222","222122","222221","121223","121322","131222","122213","122312","132212","221213","221312","231212","112232","122132","122231","113222","123122","123221","223211","221132","221231","213212","223112","312131","311222","321122","321221","312212","322112","322211","212123","212321","232121","111323","131123","131321","112313","132113","132311","211313","231113","231311","112133","112331","132131","113123","113321","133121","313121","211331","231131","213113","213311","213131","311123","311321","331121","312113","312311","332111","314111","221411","431111","111224","111422","121124","121421","141122","141221","112214","112412","122114","122411","142112","142211","241211","221114","413111","241112","134111","111242","121142","121241","114212","124112","124211","411212","421112","421211","212141","214121","412121","111143","111341","131141","114113","114311","411113","411311","113141","114131","311141","411131","211412","211214","211232","2331112"];
const C128_MAP=Object.fromEntries(C128.map((p,i)=>[p,i]));

function decode128(g){
let w=g.length,mn=255,mx=0;
for(let i=0;i<w;i++){if(g[i]<mn)mn=g[i];if(g[i]>mx)mx=g[i]}
if(mx-mn<45)return null;
let t=(mn+mx)/2,r=[],c=g[0]<t?1:0,n=0;
for(let i=0;i<w;i++){let b=g[i]<t?1:0;if(b===c)n++;else{r.push(n);c=b;n=1}}
r.push(n);if(g[0]>=t)r.shift();
for(let s=0;s<r.length-18;s+=2){
let u=(r[s]+r[s+1]+r[s+2]+r[s+3]+r[s+4]+r[s+5])/11;if(u<1.2)continue;
let p="";for(let k=0;k<6;k++)p+=Math.min(4,Math.max(1,Math.round(r[s+k]/u)));
let st=C128_MAP[p];if(st!==103&&st!==104&&st!==105)continue;
let v=[st],pos=s+6,ok=false;
while(pos+6<=r.length){
let u2=(r[pos]+r[pos+1]+r[pos+2]+r[pos+3]+r[pos+4]+r[pos+5])/11,p2="";
for(let k=0;k<6;k++)p2+=Math.min(4,Math.max(1,Math.round(r[pos+k]/u2)));
let d=C128_MAP[p2];if(d===undefined)break;if(d===106){ok=true;break}
v.push(d);pos+=6;
}
if(!ok||v.length<4)continue;
let chk=v.pop(),sum=v[0];for(let i=1;i<v.length;i++)sum+=v[i]*i;
if(sum%103!==chk)continue;
let md=v[0]===105?"C":(v[0]===103?"A":"B"),out="";
for(let i=1;i<v.length;i++){
let d=v[i];if(d===99){md="C";continue}if(d===100){md="B";continue}if(d===101){md="A";continue}
if(md==="C"){if(d<100)out+=(d<10?"0":"")+d}else{if(d>=16&&d<=25)out+=String(d-16)}
}
if(out.length>=6)return out;
}
return null;
}

const cvs=document.createElement("canvas"),ctx2=cvs.getContext("2d",{willReadFrequently:true});
function scanFB(v){
let vw=v.videoWidth,vh=v.videoHeight;if(!vw||!vh)return;
cvs.width=Math.min(900,vw);cvs.height=Math.round(cvs.width*(vh/vw));
ctx2.drawImage(v,0,0,cvs.width,cvs.height);
let y0=Math.floor(cvs.height*.3),y1=Math.floor(cvs.height*.7),step=Math.max(2,Math.floor((y1-y0)/16));
let img=ctx2.getImageData(0,y0,cvs.width,y1-y0).data;
for(let y=0;y<y1-y0;y+=step){
let l=new Uint8Array(cvs.width),off=y*cvs.width*4;
for(let x=0;x<cvs.width;x++){let p=off+x*4;l[x]=(img[p]*30+img[p+1]*59+img[p+2]*11)/100}
let res=decode128(l)||decode128(l.slice().reverse());
if(res){addRec(res);return}
}
}

async function startCam(){
document.getElementById("err").style.display="none";let btn=document.getElementById("sBtn");
try{
if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();if(actx.state==="suspended")await actx.resume();
btn.innerText="Запуск...";btn.disabled=true;
let s=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"},width:{ideal:1280}},audio:false});
let v=document.getElementById("vid");v.setAttribute("playsinline",true);v.srcObject=s;await v.play();
btn.style.display="none";if('BarcodeDetector' in window)det=new BarcodeDetector();loop(v);
}catch(e){btn.innerText="📷 Включить камеру";btn.disabled=false;err("Ошибка камеры ("+e.name+"): "+e.message)}
}
async function loop(v){
if(!paused&&v.readyState===v.HAVE_ENOUGH_DATA){
if(det){try{(await det.detect(v)).forEach(b=>b.rawValue&&addRec(b.rawValue))}catch(e){}}else scanFB(v);
}
requestAnimationFrame(()=>loop(v));
}
function exportXLS(){
if(!recs.length)return alert("Пусто");
let tot=0,rows=recs.map(r=>{
let val=String(r.v??r.w??"").replace(",","."),num=parseFloat(val);if(!isNaN(num))tot+=num;
return `<tr><td>${r.i}</td><td style="mso-number-format:'\\@'">${r.c}</td><td>${r.g}</td><td>${val}</td></tr>`;
}).join("");
tot=Math.round(tot*100)/100;
let sum=`<tr><td colspan="3" style="font-weight:bold;text-align:right">Общий объём:</td><td style="font-weight:bold">${tot}</td></tr>`;
let html=`<html xmlns:x="urn:schemas-microsoft-com:office:excel"><head><meta charset="UTF-8"></head><body><table border="1"><tr><th>№</th><th>Штрихкод</th><th>Группа крови</th><th>Объём</th></tr>${rows}${sum}</table></body></html>`;
let b=new Blob([html],{type:"application/vnd.ms-excel;charset=utf-8"}),a=document.createElement("a");
a.href=URL.createObjectURL(b);a.download=`plasma_${new Date().toISOString().slice(0,10)}.xls`;
document.body.appendChild(a);a.click();document.body.removeChild(a);
}
function clr(){if(confirm("Очистить все сохранённые записи?")){codes.clear();recs=[];localStorage.removeItem(KEY);render()}}
</script>
</body>
</html>
